<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Stick Ages</title>
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="description" content="Stick Ages: a stick-figure fighting game. Climb 19 tiers from the Stone Age to the modern day, unlocking weapons and fighters as you go.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<link rel="apple-touch-icon" id="touchicon" href="data:,">

<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #000; color: #fff; overflow: hidden;
    position: fixed; left: 0; top: 0; right: 0; bottom: 0;
    overscroll-behavior: none;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    -webkit-text-size-adjust: 100%;
    touch-action: none;
    font-family: "Avenir Next Condensed", "Helvetica Neue", Arial, sans-serif;
  }
  canvas { position: fixed; left: 0; top: 0; display: block; touch-action: none; outline: none; }
  #probe {
    position: fixed; left: 0; top: 0; width: 0; height: 0; visibility: hidden; pointer-events: none;
    padding-top: env(safe-area-inset-top, 0px);
    padding-right: env(safe-area-inset-right, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    padding-left: env(safe-area-inset-left, 0px);
  }
  noscript { position: fixed; left: 0; right: 0; top: 40%; text-align: center; font-size: 18px; }
</style>
</head>
<body>
<canvas id="c" tabindex="0" aria-label="Stick Ages game"></canvas>
<div id="probe"></div>
<noscript>Stick Ages needs JavaScript turned on.</noscript>
<script>
/* Stick Ages — single-file stick-figure fighter. No dependencies, no build step.
   Dev helpers: add ?dev to the URL to unlock everything and show FPS. */
(() => {
'use strict';
// ───────────────────────── core: math, save, canvas, layout ─────────────────────────
const VH = 390;            // logical screen height; iPhone 16 landscape is ~844 x 390 at this scale
const MINW = 620, MAXW = 1000;
const PI = Math.PI, TAU = Math.PI * 2;
const DEV = /[?&]dev\b/.test(location.search);
const FORCE_SAFE = (m => (m ? m[1].split(',').map(Number) : null))(location.search.match(/[?&]safe=([\d.,]+)/));   // ?safe=l,t,r,b fakes notch insets on a desktop

const canvas = document.getElementById('c');
const g = canvas.getContext('2d', { alpha: false });
const probe = document.getElementById('probe');

const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a = 1, b) => (b === undefined ? Math.random() * a : a + Math.random() * (b - a));
const randi = (a, b) => Math.floor(a + Math.random() * (b - a + 1));
const pick = arr => arr[(Math.random() * arr.length) | 0];
const sgn = v => (v < 0 ? -1 : 1);
const easeOut = t => 1 - (1 - t) * (1 - t);
const easeIn = t => t * t;
const easeIO = t => (t < 0.5 ? 2 * t * t : 1 - 2 * (1 - t) * (1 - t));
const easeBack = t => { const c = 1.70158; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };
function mulberry(seed) {
  return () => {
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// colours
const _hex = Object.create(null), _mix = new Map();
function hexRgb(h) {
  let c = _hex[h];
  if (!c) {
    let s = h.slice(1);
    if (s.length === 3) s = s[0] + s[0] + s[1] + s[1] + s[2] + s[2];
    const n = parseInt(s, 16);
    c = _hex[h] = [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  }
  return c;
}
function mix(a, b, t) {
  const q = Math.round(clamp(t, 0, 1) * 50);
  const k = a + b + q;
  let v = _mix.get(k);
  if (!v) {
    const A = hexRgb(a), B = hexRgb(b), u = q / 50;
    v = 'rgb(' + Math.round(lerp(A[0], B[0], u)) + ',' + Math.round(lerp(A[1], B[1], u)) + ',' + Math.round(lerp(A[2], B[2], u)) + ')';
    _mix.set(k, v);
  }
  return v;
}
function mixHex(a, b, t) {
  const A = hexRgb(a), B = hexRgb(b);
  return '#' + [0, 1, 2].map(i => Math.round(lerp(A[i], B[i], t)).toString(16).padStart(2, '0')).join('');
}
function rgba(h, a) { const c = hexRgb(h); return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')'; }
const INK = '#000000', PAPER = '#ffffff', RED = '#e8202a', GREY = '#8d8d93', DIM = '#2a2a2e';

// ───────────────────────── save ─────────────────────────
const SAVE_KEY = 'stickages.save.v1';
const save = {
  cleared: 0,        // highest campaign tier beaten (0-19)
  asc: 0,            // highest Ascension round beaten
  fighter: 'ash',
  weapon: 'club',
  picked: false,     // has the player been through fighter + weapon select once
  sound: true,
  shake: true,       // screen shake on heavy hits
  sideways: false,   // draw rotated when the phone is held upright with rotation lock on
  seenHelp: false,
  controls: 'swipe', // 'swipe' (tap, swipe, hold anywhere) or 'pad' (stick and buttons)
  seenMoves: false,  // has the swipe-era help been shown
  tut: 0,            // how far through the first-fight coaching the player is (99 = finished)
  wins: 0, losses: 0,
  lossTier: 0, lossCount: 0   // losses in a row on one tier: each takes a little off that opponent for the rematch
};
function loadSave() {
  try {
    const s = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null');
    if (s && typeof s === 'object') for (const k in save) if (typeof s[k] === typeof save[k]) save[k] = s[k];
  } catch (e) { /* private mode or blocked storage: play without saving */ }
}
function writeSave() {
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) { /* ignore */ }
}
loadSave();
const progress = () => (DEV ? 99 : save.cleared);   // tier used for unlock checks

// ───────────────────────── view / layout ─────────────────────────
const view = {
  W: 844, S: 1, ox: 0, oy: 0, dpr: 1, cw: 1, ch: 1,
  rot: false, portrait: false,
  sl: 0, sr: 0, st: 0, sb: 0,       // safe-area insets in logical units
  pS: 1, pH: 844                     // portrait prompt frame (390 units wide)
};
let quality = 1;                     // render-scale factor; drops automatically if frames run slow
let lastIW = 0, lastIH = 0, lastDPR = 0;

function layout() {
  const cw = Math.max(1, window.innerWidth), ch = Math.max(1, window.innerHeight);
  lastIW = cw; lastIH = ch; lastDPR = window.devicePixelRatio || 1;
  const dpr = Math.min(lastDPR, 3) * quality;
  view.cw = cw; view.ch = ch; view.dpr = dpr;
  const pw = Math.max(1, Math.round(cw * dpr)), ph = Math.max(1, Math.round(ch * dpr));
  if (canvas.width !== pw || canvas.height !== ph) { canvas.width = pw; canvas.height = ph; }
  canvas.style.width = cw + 'px'; canvas.style.height = ch + 'px';

  const touchy = (window.matchMedia && matchMedia('(pointer: coarse)').matches) || 'ontouchstart' in window;
  view.portrait = ch > cw * 1.1 && touchy;
  view.rot = view.portrait && save.sideways;
  const fw = view.rot ? ch : cw, fh = view.rot ? cw : ch;
  let s = fh / VH, W = fw / s;
  if (W < MINW) { W = MINW; s = fw / MINW; }
  if (W > MAXW) W = MAXW;
  const padX = (fw - W * s) / 2, padY = (fh - VH * s) / 2;
  view.W = W; view.S = s * dpr; view.ox = padX * dpr; view.oy = padY * dpr;

  let ins = { t: 0, r: 0, b: 0, l: 0 };
  try {
    const cs = getComputedStyle(probe);
    ins = { t: parseFloat(cs.paddingTop) || 0, r: parseFloat(cs.paddingRight) || 0, b: parseFloat(cs.paddingBottom) || 0, l: parseFloat(cs.paddingLeft) || 0 };
  } catch (e) { /* keep zeros */ }
  if (FORCE_SAFE) ins = { l: FORCE_SAFE[0] || 0, t: FORCE_SAFE[1] || 0, r: FORCE_SAFE[2] || 0, b: FORCE_SAFE[3] || 0 };
  const fl = view.rot ? ins.t : ins.l, fr = view.rot ? ins.b : ins.r;
  const ft = view.rot ? ins.r : ins.t, fb = view.rot ? ins.l : ins.b;
  view.sl = Math.max(0, fl - padX) / s; view.sr = Math.max(0, fr - padX) / s;
  view.st = Math.max(0, ft - padY) / s; view.sb = Math.max(0, fb - padY) / s;
  view.pS = pw / 390; view.pH = ph / view.pS;
  if (typeof layoutControls === 'function') layoutControls();
}

function baseXform() {
  if (view.rot) g.setTransform(0, view.S, -view.S, 0, canvas.width - view.oy, view.ox);
  else g.setTransform(view.S, 0, 0, view.S, view.ox, view.oy);
}
function toLogical(px, py) {
  const dx = px * view.dpr, dy = py * view.dpr;
  if (view.portrait && !view.rot) return { x: dx / view.pS, y: dy / view.pS };
  if (view.rot) return { x: (dy - view.ox) / view.S, y: (canvas.width - dx - view.oy) / view.S };
  return { x: (dx - view.ox) / view.S, y: (dy - view.oy) / view.S };
}
// safe content edges (logical)
const SL = () => view.sl, SR = () => view.W - view.sr, SB = () => VH - view.sb;

// ───────────────────────── drawing primitives ─────────────────────────
function seg(x1, y1, x2, y2) { g.beginPath(); g.moveTo(x1, y1); g.lineTo(x2, y2); g.stroke(); }
function disc(x, y, r) { g.beginPath(); g.arc(x, y, r, 0, TAU); g.fill(); }
function ring(x, y, r) { g.beginPath(); g.arc(x, y, r, 0, TAU); g.stroke(); }
function slabPath(x, y, w, h, k) {       // parallelogram: top edge pushed right by k, bottom left by k
  g.beginPath(); g.moveTo(x + k, y); g.lineTo(x + w + k, y); g.lineTo(x + w - k, y + h); g.lineTo(x - k, y + h); g.closePath();
}
function rrectPath(x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  g.beginPath(); g.moveTo(x + r, y); g.lineTo(x + w - r, y); g.arcTo(x + w, y, x + w, y + r, r);
  g.lineTo(x + w, y + h - r); g.arcTo(x + w, y + h, x + w - r, y + h, r);
  g.lineTo(x + r, y + h); g.arcTo(x, y + h, x, y + h - r, r);
  g.lineTo(x, y + r); g.arcTo(x, y, x + r, y, r); g.closePath();
}
function polyPath(pts) {
  g.beginPath(); g.moveTo(pts[0], pts[1]);
  for (let i = 2; i < pts.length; i += 2) g.lineTo(pts[i], pts[i + 1]);
  g.closePath();
}
// a round-capped stroke with a contrasting rim, the house line style
function inkLine(x1, y1, x2, y2, w, col, rim, rw) {
  g.lineCap = 'round';
  if (rim) { g.strokeStyle = rim; g.lineWidth = w + (rw || 2.4); seg(x1, y1, x2, y2); }
  g.strokeStyle = col; g.lineWidth = w; seg(x1, y1, x2, y2);
}
function inkPoly(pts, fill, rim, rw) {
  polyPath(pts);
  if (rim) { g.strokeStyle = rim; g.lineWidth = rw || 2.2; g.lineJoin = 'round'; g.stroke(); }
  g.fillStyle = fill; g.fill();
}

// ───────────────────────── audio: everything is synthesized, no files ─────────────────────────
const AudioSys = (() => {
  let ac = null, master = null, nbuf = null, lastAt = Object.create(null);

  function init() {
    if (ac) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try {
      ac = new AC();
      master = ac.createGain(); master.gain.value = 0.55;
      const comp = ac.createDynamicsCompressor();
      comp.threshold.value = -14; comp.ratio.value = 6; comp.attack.value = 0.003; comp.release.value = 0.12;
      master.connect(comp); comp.connect(ac.destination);
      const n = Math.floor(ac.sampleRate * 0.8);
      nbuf = ac.createBuffer(1, n, ac.sampleRate);
      const d = nbuf.getChannelData(0);
      for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
    } catch (e) { ac = null; }
  }
  function unlock() {
    init();
    if (ac && ac.state !== 'running' && ac.resume) { try { const p = ac.resume(); if (p && p.catch) p.catch(() => {}); } catch (e) { /* ignore */ } }
  }
  function env(gn, t, vol, dur, atk) {
    gn.gain.setValueAtTime(0.0001, t);
    gn.gain.exponentialRampToValueAtTime(Math.max(0.0002, vol), t + (atk || 0.004));
    gn.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  }
  function tone(f0, f1, dur, type, vol, delay) {
    const t = ac.currentTime + (delay || 0);
    const o = ac.createOscillator(), gn = ac.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(Math.max(20, f0), t);
    if (f1 && f1 !== f0) o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
    env(gn, t, vol, dur);
    o.connect(gn); gn.connect(master);
    o.start(t); o.stop(t + dur + 0.03);
  }
  function noise(dur, vol, f0, f1, q, type, delay) {
    const t = ac.currentTime + (delay || 0);
    const s = ac.createBufferSource(), fl = ac.createBiquadFilter(), gn = ac.createGain();
    s.buffer = nbuf; s.loop = true;
    fl.type = type || 'lowpass'; fl.Q.value = q || 0.7;
    fl.frequency.setValueAtTime(Math.max(30, f0), t);
    if (f1 && f1 !== f0) fl.frequency.exponentialRampToValueAtTime(Math.max(30, f1), t + dur);
    env(gn, t, vol, dur, 0.002);
    s.connect(fl); fl.connect(gn); gn.connect(master);
    s.start(t, Math.random() * 0.5); s.stop(t + dur + 0.03);
  }

  const S = {
    uiMove() { tone(700, 700, 0.035, 'square', 0.06); },
    uiOk() { tone(520, 1040, 0.08, 'square', 0.09); tone(1040, 1560, 0.09, 'square', 0.07, 0.06); },
    uiBack() { tone(420, 210, 0.09, 'square', 0.07); },
    uiNo() { tone(150, 110, 0.13, 'sawtooth', 0.1); },
    swing(heavy) { if (heavy) noise(0.2, 0.2, 500, 1700, 1.2, 'bandpass'); else noise(0.11, 0.16, 1100, 3000, 1.2, 'bandpass'); },
    hit(heavy) {
      if (heavy) { noise(0.15, 0.7, 1500, 180, 0.8); tone(125, 42, 0.2, 'sine', 0.85); tone(70, 38, 0.22, 'triangle', 0.4); }
      else { noise(0.07, 0.5, 2200, 320, 0.8); tone(175, 70, 0.1, 'sine', 0.55); }
    },
    slice(heavy) { noise(0.1, 0.42, 5200, 1500, 2.2, 'bandpass'); tone(heavy ? 140 : 190, 55, heavy ? 0.16 : 0.09, 'sine', heavy ? 0.7 : 0.45); },
    block() { tone(1244, 1180, 0.07, 'square', 0.1); tone(1661, 1600, 0.06, 'square', 0.07); noise(0.05, 0.25, 3200, 2400, 3, 'bandpass'); },
    guardbreak() { noise(0.3, 0.55, 6000, 900, 0.8, 'highpass'); tone(1100, 180, 0.24, 'square', 0.16); },
    shot(kind) {
      if (kind === 'heavy') { noise(0.28, 0.95, 2600, 220, 0.7); tone(115, 34, 0.22, 'sine', 0.7); }
      else if (kind === 'auto') { noise(0.06, 0.42, 5200, 1100, 0.7); tone(310, 110, 0.045, 'square', 0.14); }
      else if (kind === 'rifle') { noise(0.34, 0.85, 6500, 380, 0.7); tone(190, 40, 0.28, 'sawtooth', 0.28); }
      else if (kind === 'powder') { noise(0.04, 0.3, 5000, 4000, 1, 'highpass'); noise(0.34, 0.85, 1900, 170, 0.7, 'lowpass', 0.045); tone(100, 36, 0.26, 'sine', 0.55, 0.045); }
      else { noise(0.13, 0.7, 4200, 520, 0.7); tone(230, 60, 0.09, 'square', 0.24); }
    },
    twang() { tone(310, 150, 0.1, 'triangle', 0.3); noise(0.12, 0.14, 2200, 4200, 2, 'bandpass'); },
    thunk() { tone(210, 120, 0.06, 'square', 0.2); noise(0.07, 0.3, 1800, 600, 1); },
    throw_() { noise(0.14, 0.15, 800, 2600, 1.2, 'bandpass'); },
    launch() { noise(0.5, 0.5, 500, 3400, 1.1, 'bandpass'); tone(90, 50, 0.3, 'sawtooth', 0.25); },
    boom() { noise(0.7, 1.0, 1300, 55, 0.6); tone(92, 26, 0.55, 'sine', 0.95); noise(0.25, 0.4, 4000, 800, 0.7, 'highpass'); },
    saw() { tone(78, 96, 0.11, 'sawtooth', 0.3); noise(0.09, 0.2, 2600, 1800, 3, 'bandpass'); },
    fuse() { noise(0.12, 0.08, 6000, 5000, 2, 'highpass'); },
    jump() { tone(250, 430, 0.08, 'sine', 0.1); },
    land() { noise(0.07, 0.2, 520, 180, 0.7); },
    dash() { noise(0.13, 0.17, 1300, 3400, 1.1, 'bandpass'); },
    thud() { noise(0.14, 0.5, 600, 90, 0.7); tone(80, 40, 0.16, 'sine', 0.6); },
    reload() { noise(0.025, 0.25, 3400, 3000, 4, 'bandpass'); noise(0.03, 0.3, 2400, 2000, 4, 'bandpass', 0.11); },
    click() { noise(0.02, 0.2, 3000, 2600, 5, 'bandpass'); },
    ko() { tone(420, 55, 0.75, 'sawtooth', 0.3); noise(0.5, 0.6, 900, 80, 0.7); tone(70, 30, 0.6, 'sine', 0.8); },
    bell() { tone(880, 880, 0.6, 'triangle', 0.26); tone(1320, 1320, 0.45, 'sine', 0.16); tone(2640, 2640, 0.2, 'sine', 0.06); },
    fight() { tone(196, 392, 0.16, 'sawtooth', 0.26); tone(392, 784, 0.2, 'square', 0.14, 0.1); },
    super_() { tone(180, 1500, 0.4, 'sawtooth', 0.26); noise(0.42, 0.3, 500, 6000, 1.4, 'bandpass'); },
    special() { tone(330, 990, 0.16, 'square', 0.13); tone(660, 1320, 0.14, 'triangle', 0.12, 0.05); noise(0.16, 0.2, 900, 5200, 1.4, 'bandpass'); },
    flip() { noise(0.2, 0.16, 700, 2600, 1.3, 'bandpass'); tone(300, 520, 0.12, 'sine', 0.07); },
    launchUp() { tone(160, 620, 0.16, 'triangle', 0.22); noise(0.1, 0.3, 1600, 4200, 1.2, 'bandpass'); },
    wave() { noise(0.3, 0.3, 2600, 700, 1.6, 'bandpass'); tone(520, 180, 0.24, 'sawtooth', 0.1); },
    quake() { noise(0.4, 0.8, 500, 60, 0.7); tone(70, 28, 0.4, 'sine', 0.8); },
    meter() { tone(880, 1320, 0.09, 'triangle', 0.1); tone(1320, 1760, 0.1, 'triangle', 0.08, 0.07); },
    win() { [523, 659, 784, 1047].forEach((f, i) => tone(f, f, 0.16, 'square', 0.11, i * 0.11)); tone(1319, 1319, 0.4, 'triangle', 0.14, 0.44); },
    lose() { [392, 330, 262, 196].forEach((f, i) => tone(f, f * 0.97, 0.22, 'triangle', 0.14, i * 0.17)); },
    unlock() { [784, 988, 1175, 1568].forEach((f, i) => tone(f, f, 0.14, 'triangle', 0.13, i * 0.07)); },
    tick() { tone(1000, 1000, 0.03, 'square', 0.07); },
    vs() { tone(110, 55, 0.5, 'sawtooth', 0.3); noise(0.4, 0.4, 3000, 200, 0.7); }
  };
  const MIN_GAP = { flip: 0.05, quake: 0.08, hit: 0.03, block: 0.04, shot: 0.03, swing: 0.04, saw: 0.05, boom: 0.06, thud: 0.05, land: 0.05, slice: 0.03 };

  function play(name, a) {
    if (!save.sound || !ac || ac.state !== 'running') return;
    const fn = S[name];
    if (!fn) return;
    const now = ac.currentTime, gap = MIN_GAP[name];
    if (gap) { if (now - (lastAt[name] || -1) < gap) return; lastAt[name] = now; }
    try { fn(a); } catch (e) { /* never let sound break the game */ }
  }
  return { unlock, play, names: () => Object.keys(S), raw(name, a) { init(); S[name](a); }, state: () => (ac ? ac.state : 'none') };
})();
const sfx = (name, a) => AudioSys.play(name, a);

// ───────────────────────── input: swipe gestures, touch pad, keyboard, controller, menu pointer ─────────────────────────
const keys = Object.create(null);
let keyHits = [];                         // key codes pressed since the last frame
const ui = { clicks: [], px: -100, py: -100, down: false, drag: null, wheel: 0 };
const ptrs = new Map();
const ctl = {
  on: false,                              // a fight is running and wants the controls
  touchSeen: false,
  stick: { id: null, bx: 0, by: 0, x: 0, y: 0, hx: 0, hy: 0, r: 44 },
  btns: [],
  zones: [],                              // rects that stay ordinary UI while the controls are on
  edge: { atk: false, kick: false, dash: false, sp1: false, sp2: false, sp3: false },
  swq: [],                                // swipes waiting for the simulation: 1 right, 2 left, 3 up, 4 down
  marks: []                               // fading touch feedback
};
const KEYMAP = {
  KeyJ: 'atk', KeyZ: 'atk', KeyK: 'kick', KeyX: 'kick', KeyL: 'guard', KeyC: 'guard',
  ShiftLeft: 'dash', ShiftRight: 'dash', KeyV: 'dash', KeyU: 'sp1', KeyI: 'sp2', KeyO: 'sp3', Space: 'sp3'
};
const GAME_KEYS = new Set(['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Space', 'Enter', 'Escape', 'Backspace', 'Tab',
  'KeyW', 'KeyA', 'KeyS', 'KeyD', 'KeyJ', 'KeyK', 'KeyL', 'KeyU', 'KeyI', 'KeyO', 'KeyZ', 'KeyX', 'KeyC', 'KeyV', 'KeyP']);
// gesture tuning, in logical units (about a CSS pixel on a phone) and milliseconds

function inRect(px, py, x, y, w, h, pad) { pad = pad || 0; return px >= x - pad && px <= x + w + pad && py >= y - pad && py <= y + h + pad; }
function uiClick(x, y, w, h, pad) {
  for (let i = 0; i < ui.clicks.length; i++) {
    const c = ui.clicks[i];
    if (inRect(c.x, c.y, x, y, w, h, pad) && inRect(c.sx, c.sy, x, y, w, h, (pad || 0) + 10)) { ui.clicks.splice(i, 1); return true; }
  }
  return false;
}
const uiOver = (x, y, w, h, pad) => inRect(ui.px, ui.py, x, y, w, h, pad);

// o: { kind:'primary'|'plain'|'ghost', disabled, size, snd, key }
function button(x, y, w, h, label, o) {
  o = o || {};
  const kind = o.kind || 'plain';
  const over = !o.disabled && uiOver(x, y, w, h, 4);
  const pressed = over && ui.down;
  const k = h * 0.16;
  g.save();
  if (pressed) g.translate(1.5, 2);
  if (!pressed) { g.fillStyle = 'rgba(0,0,0,0.55)'; slabPath(x + 3, y + 4, w, h, k); g.fill(); }
  let fill = kind === 'primary' ? RED : kind === 'ghost' ? INK : PAPER;
  let ink = kind === 'plain' ? INK : PAPER;
  if (o.disabled) { fill = DIM; ink = GREY; }
  else if (pressed) fill = kind === 'primary' ? '#b5141d' : kind === 'ghost' ? '#1c1c20' : '#d9d9de';
  slabPath(x, y, w, h, k);
  g.fillStyle = fill; g.fill();
  g.lineWidth = 2; g.lineJoin = 'round';
  g.strokeStyle = kind === 'ghost' ? (o.disabled ? DIM : PAPER) : INK; g.stroke();
  const size = o.size || Math.min(15, h * 0.4);
  stickFit(label, x + w / 2, y + h / 2 + size / 2, size, w - h * 0.6, { align: 0.5, col: ink, rim: null, wt: 0.19 });
  g.restore();
  let hit = uiClick(x, y, w, h, 5);
  if (!hit && o.key && keyHit.apply(null, o.key)) hit = true;
  if (hit) {
    if (o.disabled) { sfx('uiNo'); return false; }
    sfx(o.snd || 'uiOk');
    return true;
  }
  return false;
}
// a stat row: label, then a 10-segment meter
function statBar(x, y, w, label, v, max, col) {
  txt(label, x, y, 11, { col: '#bdbdc4', w: 600 });
  const bx = x + 58, bw = w - 58, n = 10, gap = 2, sw = (bw - gap * (n - 1)) / n;
  const filled = clamp(v / max, 0, 1) * n;
  for (let i = 0; i < n; i++) {
    const sx = bx + i * (sw + gap);
    g.fillStyle = i < Math.floor(filled + 0.001) ? (col || PAPER) : '#34343a';
    slabPath(sx, y - 8, sw, 8, 1.2); g.fill();
  }
}
function lockIcon(x, y, s, col) {
  g.save(); g.translate(x, y); g.scale(s, s);
  g.strokeStyle = col; g.fillStyle = col; g.lineWidth = 1.6; g.lineCap = 'round';
  g.beginPath(); g.arc(0, -3, 3.4, PI, 0); g.stroke();
  rrectPath(-5, -3, 10, 8, 1.6); g.fill();
  g.restore();
}
function checkIcon(x, y, s, col, lw) {
  g.strokeStyle = col; g.lineWidth = lw || 2.4; g.lineCap = 'round'; g.lineJoin = 'round';
  g.beginPath(); g.moveTo(x - 4 * s, y); g.lineTo(x - 1 * s, y + 3.4 * s); g.lineTo(x + 4.6 * s, y - 3.6 * s); g.stroke();
}

function tierInfo(n) {

    react: Math.round(lerp(24, 14, sk)),            // frames before it responds to what you do
    think: Math.round(lerp(26, 11, sk)),            // frames between decisions
    aggro: lerp(0.34, 0.8, sk),

// A pose is 13 numbers:
// 0 hip height · 1 torso lean · 2 head tilt · 3,4 near arm (shoulder, elbow) · 5,6 far arm
// 7,8 near foot (x, lift) · 9,10 far foot (x, lift) · 11 weapon angle relative to the forearm
// 12 whole-body rotation about the waist, for flips (positive tips the head forward)
// Limb angles: 0 hangs straight down, PI/2 points forward, PI points up. Legs are solved by IK from foot targets.

function mkPose(base, o) {
  const p = base ? base.slice() : new Array(NP).fill(0);
  if (!o) return p;
  if (o.h !== undefined) p[0] = o.h;
  if (o.t !== undefined) p[1] = o.t;
  if (o.hd !== undefined) p[2] = o.hd;
  if (o.af) { p[3] = o.af[0]; p[4] = o.af[1]; }
  if (o.ab) { p[5] = o.ab[0]; p[6] = o.ab[1]; }
  if (o.ff) { p[7] = o.ff[0]; p[8] = o.ff[1]; }
  if (o.fb) { p[9] = o.fb[0]; p[10] = o.fb[1]; }

  if (o.rot !== undefined) p[12] = o.rot;
  return p;
}

function copyPose(a, out) { for (let i = 0; i < NP; i++) out[i] = a[i]; return out; }

  newAttract() {

    w.snapCam();

// ───────────────────────── the fight: rounds, HUD, touch controls, results ─────────────────────────
const PAD_ICON = {
  kick() { polyPath([-5, -9, 1, -9, 1, -1, 9, 1, 9, 6, -5, 6]); g.fill(); },
  guard() { polyPath([0, -10, 8.5, -6.5, 8.5, 1, 0, 10, -8.5, 1, -8.5, -6.5]); g.fill(); },
  dash() { g.lineWidth = 3.4; g.lineCap = 'round'; g.lineJoin = 'round'; g.beginPath(); g.moveTo(-8, -7); g.lineTo(-1, 0); g.lineTo(-8, 7); g.moveTo(1, -7); g.lineTo(8, 0); g.lineTo(1, 7); g.stroke(); },
  sup() { polyPath([2.5, -11, -6.5, 1.5, -1, 1.5, -3.5, 11, 6.5, -2.5, 1, -2.5]); g.fill(); }
};
const PAD_LABEL = { kick: 'Kick', guard: 'Guard', dash: 'Dash' };
const SP_NUM = { sp1: 1, sp2: 2, sp3: 3 };

// one of the three meter buttons: 1 and 2 are the weapon's specials, the bolt is the super
function drawSpecialBtn(b, f, named) {
  const k = SP_NUM[b.name], ready = f.meter >= k * 100, sup = k === 3, held = b.held > 0;
  const frac = clamp((f.meter - (k - 1) * 100) / 100, 0, 1);
  g.globalAlpha = ready ? 0.86 + 0.14 * Math.sin(tick * 0.25 + k) : 0.46;
  g.fillStyle = held ? 'rgba(255,255,255,0.55)' : ready ? (sup ? RED : PAPER) : 'rgba(0,0,0,0.5)';
  disc(b.x, b.y, b.r);
  g.strokeStyle = ready && !sup ? INK : PAPER; g.lineWidth = 2.2; ring(b.x, b.y, b.r);
  if (ready) { g.strokeStyle = sup ? PAPER : RED; g.lineWidth = 2; ring(b.x, b.y, b.r + 3.5); }
  else if (frac > 0.01) { g.globalAlpha = 0.9; g.strokeStyle = RED; g.lineWidth = 3.6; g.lineCap = 'butt'; g.beginPath(); g.arc(b.x, b.y, b.r, -PI / 2, -PI / 2 + TAU * frac); g.stroke(); g.lineCap = 'round'; }
  g.globalAlpha = ready ? 1 : 0.62;
  const ink = ready && !sup ? INK : PAPER;
  if (sup) { g.fillStyle = ink; g.save(); g.translate(b.x, b.y); g.scale(b.r / 21, b.r / 21); PAD_ICON.sup(); g.restore(); }
  else stickText(String(k), b.x + 0.5, b.y + b.r * 0.36, b.r * 0.74, { align: 0.5, col: ink, rim: null, wt: 0.2, slant: 0.06 });
  if (named) {
    const m = sup ? f.weapon.sup : f.weapon.sp[k - 1];
    txt(m.name, b.x, b.y - b.r - 6, 10, { align: 'center', w: 700, sh: true, col: ready ? PAPER : '#b4b4bc' });
  }
  g.globalAlpha = 1;
}
// where the fingers are and what they just did
function drawTouches() {
  const M = ctl.marks;
  g.lineCap = 'round'; g.lineJoin = 'round';
  for (let i = M.length - 1; i >= 0; i--) {
    const m = M[i];
    if (--m.life <= 0) { M.splice(i, 1); continue; }
    const u = m.life / (m.k === 1 ? 18 : 12);
    g.globalAlpha = Math.min(1, u * 1.5) * 0.85;
    if (m.k === 0) { g.strokeStyle = PAPER; g.lineWidth = 2.6; ring(m.x, m.y, 12 + (1 - u) * 16); }
    else if (m.k === 2) { g.strokeStyle = '#bfe9ff'; g.lineWidth = 3; ring(m.x, m.y, 30 - (1 - u) * 6); }
    else {
      const vx = m.dir === 1 ? 1 : m.dir === 2 ? -1 : 0, vy = m.dir === 3 ? -1 : m.dir === 4 ? 1 : 0, L = 30 + (1 - u) * 30;
      const x1 = m.x + vx * L, y1 = m.y + vy * L;
      g.strokeStyle = INK; g.lineWidth = 8 * u + 3;
      for (let pass = 0; pass < 2; pass++) {
        g.beginPath(); g.moveTo(m.x, m.y); g.lineTo(x1, y1);
        g.moveTo(x1 - vx * 11 - vy * 9, y1 - vy * 11 - vx * 9); g.lineTo(x1, y1); g.lineTo(x1 - vx * 11 + vy * 9, y1 - vy * 11 + vx * 9); g.stroke();
        g.strokeStyle = PAPER; g.lineWidth = 5 * u + 1.2;
      }
    }
  }
  for (const P of ptrs.values()) {
    if (P.role !== 'gest') continue;
    if (P.phase === 1) { g.globalAlpha = 0.75; g.fillStyle = 'rgba(191,233,255,0.2)'; disc(P.x, P.y, 26); g.strokeStyle = '#bfe9ff'; g.lineWidth = 3; ring(P.x, P.y, 26); }
    else if (P.phase === 2) { g.globalAlpha = 0.5; g.fillStyle = PAPER; disc(P.x, P.y, 10); }
  }
  g.globalAlpha = 1;
}

function drawPad(f) {
  g.save();
  if (swipeMode()) {                                         // nothing on screen but the meter buttons and your own fingerprints
    for (const b of ctl.btns) drawSpecialBtn(b, f, true);
    drawTouches();
    g.restore();
    return;
  }
  if (!ctl.touchSeen) { g.restore(); return; }
  const s = ctl.stick, on = s.id !== null;
  g.globalAlpha = on ? 0.62 : 0.36;
  g.fillStyle = 'rgba(0,0,0,0.4)'; disc(s.bx, s.by, s.r + 10);
  g.strokeStyle = PAPER; g.lineWidth = 2; ring(s.bx, s.by, s.r + 10);
  g.lineWidth = 2.4; g.lineCap = 'round'; g.lineJoin = 'round';
  for (let i = 0; i < 4; i++) {
    const a = i * PI / 2, ca = Math.cos(a), sa = Math.sin(a), cx = s.bx + ca * (s.r - 1), cy = s.by + sa * (s.r - 1);
    g.beginPath(); g.moveTo(cx - ca * 4 - sa * 5, cy - sa * 4 + ca * 5); g.lineTo(cx + ca * 3, cy + sa * 3); g.lineTo(cx - ca * 4 + sa * 5, cy - sa * 4 - ca * 5); g.stroke();
  }
  g.globalAlpha = on ? 0.92 : 0.58;
  g.fillStyle = PAPER; disc(s.x, s.y, 21); g.fillStyle = 'rgba(0,0,0,0.22)'; disc(s.x, s.y, 14);
  for (const b of ctl.btns) {
    if (b.name in SP_NUM) { drawSpecialBtn(b, f, false); continue; }
    const held = b.held > 0, alpha = held ? 0.96 : 0.66;
    g.globalAlpha = alpha;
    g.fillStyle = held ? 'rgba(255,255,255,0.42)' : 'rgba(0,0,0,0.44)'; disc(b.x, b.y, b.r);
    g.strokeStyle = PAPER; g.lineWidth = 2.2; ring(b.x, b.y, b.r);
    if (b.name === 'atk') {
      const W = f.weapon, dry = !!W.fire && !!W.fire.mag && f.ammo <= 0;
      g.globalAlpha = Math.min(1, alpha + 0.2);
      if (dry) { g.fillStyle = PAPER; g.save(); g.translate(b.x, b.y - 2); g.scale(1.25, 1.25); PAD_ICON.kick(); g.restore(); }
      else drawWeaponIcon(W.id, b.x, b.y - (W.fire && W.fire.mag ? 4 : 0), b.r * 1.36, { h: b.r * 1.0 });
      if (W.fire && W.fire.mag) {
        if (f.reload > 0) { g.strokeStyle = PAPER; g.lineWidth = 3.4; g.lineCap = 'butt'; g.beginPath(); g.arc(b.x, b.y, b.r, -PI / 2, -PI / 2 + TAU * (1 - f.reload / f.reloadMax)); g.stroke(); }
        txt(dry ? 'Reloading' : String(f.ammo), b.x, b.y + b.r - 7, dry ? 9 : 11, { align: 'center', w: 700, sh: true });
      }
    } else {
      g.fillStyle = PAPER; g.strokeStyle = PAPER;
      g.save(); g.translate(b.x, b.y - 4); g.scale(0.92, 0.92); PAD_ICON[b.name](); g.restore();
      txt(PAD_LABEL[b.name], b.x, b.y + b.r - 6.5, 9, { align: 'center', w: 700 });
    }
  }
  g.restore();
}

// first-fight coaching: one line at a time, each cleared by doing the thing it describes
const used = (f, k) => f.used[k] || 0;
const COACH = [
  { swipe: 'Tap anywhere to attack. Keep tapping to chain the hits.', pad: 'Attack swings or fires. Press it again to chain the hits.', gun: ['Tap anywhere to fire.', 'Attack fires.'], done: f => used(f, 'atk') >= 3 },
  { swipe: 'Swipe toward them to rush in.', pad: 'Dash rushes in.', done: f => used(f, 'rush') >= 1 },
  { swipe: 'Swipe away from them to flip back out of reach.', pad: 'Hold away and press Dash to flip back out of reach.', done: f => used(f, 'flip') >= 1 },
  { swipe: 'Hold a finger still to guard.', pad: 'Hold Guard to block.', done: f => used(f, 'held') + used(f, 'block') >= 1 },
  { swipe: 'Swipe up to leap in. Swipe down to slide under.', pad: 'Up and Dash leaps in. Down and Dash slides under.', done: f => used(f, 'leap') + used(f, 'slide') >= 1 },
  { swipe: 'Land a hit, then swipe up to launch them. Keep tapping while they are in the air.', pad: 'Land a hit, then Up and Dash to launch them. Keep attacking while they are in the air.',
    gun: ['Rush in, then swipe up to kick them into the air. Then shoot.', 'Dash in, then Up and Dash to kick them into the air. Then shoot.'], done: f => used(f, 'launch') >= 1 },
  { swipe: 'One bar of meter is full. Tap 1 to spend it on a special.', pad: 'One bar of meter is full. Press 1 to spend it on a special.', wait: 'Hits fill the red meter under your health.', done: f => used(f, 'special') >= 1 }
];

const Fight = {
  enter() {
    const n = game.tier, info = tierInfo(n), L = difficulty(n);
    this.n = n; this.info = info; this.lv = L;
    const w = this.w = new World({ era: info.era, audible: true });
    const idx = info.asc ? 0 : (n - 1) % 3;
    w.tint = info.era === 6 ? null : (idx === 2 || info.boss) ? 'rgba(30,0,24,0.26)' : idx === 1 ? 'rgba(40,10,70,0.12)' : null;
    this.p1 = w.add(FIGHTER_BY_ID[save.fighter], save.weapon, 330, 1, { player: true });
    const ease = save.lossTier === n ? Math.min(save.lossCount, 5) * 0.05 : 0;      // worn down by earlier attempts
    const odef = info.def.id === save.fighter ? mirrorDef(info.def) : info.def;
    this.p2 = w.add(odef, info.weapon, 630, -1, { hpMul: L.hp * (1 - ease), dmgMul: L.dmg * (1 - ease * 0.5), sc: info.boss && !info.asc ? 1.1 : 1 });
    this.ai = new AI(this.p2, L, { alt: info.alt, phases: info.phases });
    this.inp = blankInput(); this.blank = blankInput();
    this.round = 1; this.phase = 'intro'; this.pt = 0; this.timer = 3600; this.timeUp = false; this.roundWin = null;
    this.paused = false; this.overlay = null; this.draws = 0; this.msg = null; this.frames = 0; this.perfects = 0; this.ended = false;
    this.auto = null; this.coachT = 0; this.coachOk = 0;
    w.snapCam(); ctl.on = true; clearEdges();
    if (!save.seenMoves) { this.paused = true; this.overlay = 'help'; }
  },
  leave() { ctl.on = false; ctl.zones.length = 0; releaseAll(); },
  say(str, col, life, big, sub) { this.msg = { str, col: col || PAPER, life, max: life, big: big || 1, sub: sub || null }; },
  update() {
    if (this.paused || this.ended) return;
    const w = this.w, p1 = this.p1, p2 = this.p2;
    this.pt++;
    if (this.msg && --this.msg.life <= 0) this.msg = null;
    switch (this.phase) {
      case 'intro':
        w.step(this.blank, this.blank);
        if (this.pt === 10) { this.say('Round ' + this.round, PAPER, 62); sfx('bell'); }
        if (this.pt === 76) { this.say('Fight!', RED, 42); sfx('fight'); }
        if (this.pt >= 90) { this.phase = 'fight'; this.pt = 0; clearEdges(); }
        break;
      case 'fight':
        if (this.auto) { readPad(this.blank2 || (this.blank2 = blankInput())); Object.assign(this.inp, this.auto.think()); } else readPad(this.inp);   // 'auto' is a test hook: an AI plays for you
        w.step(this.inp, this.ai.think());
        this.frames++;
        this.coach();
        if (w.hitstop <= 0) this.timer--;
        if (this.timer > 0 && this.timer <= 600 && this.timer % 60 === 0) sfx('tick');
        if (w.ko) { this.phase = 'ko'; this.pt = 0; this.say('K.O.', RED, 112, 1.5); }
        else if (this.timer <= 0) { this.phase = 'ko'; this.pt = 50; this.timeUp = true; this.say('Time', PAPER, 70); sfx('bell'); }
        break;
      case 'ko':
        w.step(this.blank, this.blank);
        if (this.pt > 122) this.endRound();
        break;
      case 'after':
        w.step(this.blank, this.blank);
        if (this.roundWin && this.roundWin.canAct()) this.roundWin.setState('win');
        if (this.pt > 100) this.next();
        break;
    }
  },
  endRound() {
    const p1 = this.p1, p2 = this.p2, w = this.w;
    let win = null;
    if (this.timeUp) { const a = p1.hp / p1.hpMax, b = p2.hp / p2.hpMax; win = a > b ? p1 : b > a ? p2 : null; }
    else if (w.ko && !w.ko.double && !w.ko.winner.ko) win = w.ko.winner;
    this.timeUp = false; this.roundWin = win;
    if (win) {
      win.wins++;
      const perfect = win === p1 && p1.hp >= p1.hpMax - 0.01;
      if (perfect) this.perfects++;
      this.say(win === p1 ? 'You win' : 'You lose', win === p1 ? PAPER : RED, 96, 1, perfect ? 'Perfect' : null);
      if (win.wins < 2) sfx('bell');
    } else {
      this.draws++;
      if (this.draws >= 2) p2.wins++;
      this.say('Draw', PAPER, 96);
    }
    this.phase = 'after'; this.pt = 0;
  },
  next() {
    const p1 = this.p1, p2 = this.p2;
    if (p1.wins >= 2 || p2.wins >= 2) return this.finish(p1.wins >= 2 && p1.wins > p2.wins);
    this.round++;
    this.w.clearRound();
    p1.reset(330, 1); p2.reset(630, -1);
    this.ai = new AI(p2, this.lv, { alt: this.info.alt, phases: this.info.phases });
    this.phase = 'intro'; this.pt = 0; this.timer = 3600; this.roundWin = null;
  },
  finish(won) {
    if (this.ended) return;
    this.ended = true;
    const n = this.n;
    let unlocked = [], first = false;
    if (won) {
      save.wins++;
      if (n <= LAST_TIER) { if (n === save.cleared + 1) { save.cleared = n; unlocked = unlocksAt(n); first = true; } }
      else if (n - LAST_TIER > save.asc) { save.asc = n - LAST_TIER; first = true; }
      if (save.lossTier === n) { save.lossTier = 0; save.lossCount = 0; }
    } else {
      save.losses++;
      if (save.lossTier === n) save.lossCount++; else { save.lossTier = n; save.lossCount = 1; }
    }
    writeSave();
    go(Result, { won, n, unlocked, first, frames: this.frames, perfects: this.perfects, combo: this.p1.maxCombo, info: this.info });
  },

  bar(f, x, y, w, dir) {
    const h = 13, k = 2;
    g.fillStyle = INK; slabPath(x - 2.5, y - 2.5, w + 5, h + 5, k * 1.4); g.fill();
    g.fillStyle = '#3a3a40'; slabPath(x, y, w, h, k); g.fill();
    const part = (fr, col) => { if (fr <= 0.002) return; const ww = w * fr; g.fillStyle = col; slabPath(dir > 0 ? x + w - ww : x, y, ww, h, k); g.fill(); };
    const frac = clamp(f.hp / f.hpMax, 0, 1);
    part(clamp(f.hpLag / f.hpMax, 0, 1), RED);
    part(frac, frac < 0.25 && tick % 20 < 10 ? '#ffc9c9' : PAPER);
    // guard gauge
    const gw = w * 0.46, gf = clamp(f.guardG / 100, 0, 1), gx = dir > 0 ? x + w - gw - 3 : x + 3, gy = y + h + 4.5;
    g.fillStyle = INK; g.fillRect(gx - 1.5, gy - 1.5, gw + 3, 6);
    g.fillStyle = f.state === 'dizzy' ? RED : gf < 0.34 ? '#ff9d1e' : '#bfe9ff';
    g.fillRect(dir > 0 ? gx + gw * (1 - gf) : gx, gy, gw * gf, 3);
    // rounds won
    for (let i = 0; i < 2; i++) {
      const px = dir > 0 ? x + w - gw - 16 - i * 14 : x + gw + 16 + i * 14;
      g.fillStyle = INK; disc(px, gy + 1.5, 5.6); g.fillStyle = i < f.wins ? RED : '#55555d'; disc(px, gy + 1.5, 3.6);
    }
    stickFit(f.def.name, dir > 0 ? x - 1 : x + w + 1, y + h + 23, 9.5, w * 0.42, { align: dir > 0 ? 0 : 1, wt: 0.2 });
    // meter in three bars (special 1, special 2, super), then weapon and ammo
    const mw = 96, mx = dir > 0 ? x : x + w - mw, my = y + h + 30, bw = (mw - 8) / 3;
    for (let i = 0; i < 3; i++) {
      const bx = dir > 0 ? mx + i * (bw + 4) : mx + mw - bw - i * (bw + 4), fr = clamp((f.meter - i * 100) / 100, 0, 1);
      g.fillStyle = INK; slabPath(bx - 2, my - 2, bw + 4, 9, 1.6); g.fill();
      g.fillStyle = '#3a3a40'; slabPath(bx, my, bw, 5, 1); g.fill();
      if (fr > 0.03) { const fw = bw * fr; g.fillStyle = fr >= 1 ? (f.meter >= METER_MAX && tick % 12 < 6 ? PAPER : RED) : '#a3161d'; slabPath(dir > 0 ? bx : bx + bw - fw, my, fw, 5, 1); g.fill(); }
    }
    const wx = dir > 0 ? mx + mw + 18 : mx - 18;
    drawWeaponIcon(f.weapon.id, wx, my + 2, 26, { h: 16 });
    const F = f.weapon.fire;
    if (F && F.mag) txt(f.ammo <= 0 ? 'reload' : f.ammo + '/' + F.mag, dir > 0 ? wx + 15 : wx - 15, my + 7, 11.5, { align: dir > 0 ? 'left' : 'right', col: f.ammo <= 0 ? '#ff8a8f' : PAPER, w: 700, sh: true });
  },
  drawHUD() {
    const p1 = this.p1, p2 = this.p2, cx = view.W / 2, top = view.st + 9;
    const L = SL() + 12, half = Math.min(310, cx - 38 - L);
    this.bar(p1, cx - 38 - half, top, half, 1);
    this.bar(p2, cx + 38, top, half, -1);
    polyPath([cx - 29, top - 4, cx + 29, top - 4, cx + 23, top + 27, cx - 23, top + 27]);
    g.fillStyle = INK; g.fill(); g.strokeStyle = PAPER; g.lineWidth = 2; g.lineJoin = 'round'; g.stroke();
    const sec = clamp(Math.ceil(this.timer / 60), 0, 99);
    stickText(String(sec), cx, top + 20.5, 15.5, { align: 0.5, rim: null, col: sec <= 10 && tick % 30 < 15 ? RED : PAPER, slant: 0.06, wt: 0.2 });
    // combo counters
    const cL = (f, x, al) => {
      if (f.comboT <= 0 || f.comboShow < 2) return;
      const pop = f.comboT > 68 ? 1 + (f.comboT - 68) * 0.06 : 1;
      stickText(f.comboShow + ' hits', x, top + 86, 15 * pop, { align: al, col: RED, rim: PAPER, rimW: 1.2, alpha: Math.min(1, f.comboT / 12) });
    };
    cL(p1, cx - 38 - half, 0); cL(p2, cx + 38 + half, 1);
    // pause button
    const pz = { x: cx - 19, y: top + 32, w: 38, h: 20 };
    ctl.zones.length = 0; ctl.zones.push({ x: pz.x - 8, y: pz.y - 4, w: pz.w + 16, h: pz.h + 10 });
    g.fillStyle = 'rgba(0,0,0,0.55)'; slabPath(pz.x, pz.y, pz.w, pz.h, 2); g.fill();
    g.fillStyle = PAPER; g.fillRect(cx - 5, pz.y + 5, 3.4, 10); g.fillRect(cx + 1.6, pz.y + 5, 3.4, 10);
    if (!this.paused && this.phase !== 'after' && (uiClick(pz.x - 8, pz.y - 4, pz.w + 16, pz.h + 10) || keyHit('KeyP', 'Escape'))) { this.paused = true; sfx('uiMove'); releaseAll(); }
  },
  drawMarks() {
    // "you" marker for the first seconds of a round
    const w = this.w, f = this.p1, c = w.cam;
    if (this.phase === 'intro' || (this.phase === 'fight' && this.pt < 150)) {
      const sx = view.W / 2 + (f.x - c.x) * c.z, sy = c.gy + (f.y - 112 * f.sc) * c.z + Math.sin(tick * 0.2) * 3;
      Pg(INK, [sx - 9, sy - 9, sx + 9, sy - 9, sx, sy + 5]); Pg(RED, [sx - 6, sy - 7.4, sx + 6, sy - 7.4, sx, sy + 2]);
      stickText('You', sx, sy - 13, 8, { align: 0.5, wt: 0.2 });
    }
  },
  drawSay() {
    const m = this.msg;
    if (!m) return;
    const age = m.max - m.life, s = (1 + (1 - easeOut(clamp(age / 8, 0, 1))) * 1.5) * m.big, a = Math.min(1, m.life / 10);
    stickText(m.str, view.W / 2 + 3, 124 + 17 * s, 34 * s, { align: 0.5, col: m.col, rim: m.col === RED ? PAPER : INK, rimW: 1.4, alpha: a, wt: 0.19 });
    if (m.sub && age > 14) stickText(m.sub, view.W / 2, 190, 15, { align: 0.5, col: RED, rim: PAPER, rimW: 1.2, alpha: a });
  },
  drawPause() {
    if (this.overlay === 'help') {
      if (drawHelp()) { this.overlay = null; if (!save.seenMoves) { save.seenMoves = true; save.seenHelp = true; writeSave(); this.paused = false; } }
      return;
    }
    if (this.overlay === 'moves') { if (drawMoves(this.p1.weapon)) this.overlay = null; return; }
    if (this.overlay === 'options') { if (drawOptions(true)) this.overlay = null; return; }
    const P = overlayPanel(308, 316, 'Paused');
    const x = P.x + 44, w = 220;
    let y = P.y + 62;
    if (button(x, y, w, 38, 'Resume', { kind: 'primary', key: ['Escape', 'KeyP', 'Enter'] })) this.paused = false;
    y += 48;
    if (button(x, y, w, 32, 'Moves', { kind: 'plain', size: 10.5 })) this.overlay = 'moves';
    y += 41;
    if (button(x, y, w / 2 - 5, 32, 'Help', { kind: 'ghost', size: 10 })) this.overlay = 'help';
    if (button(x + w / 2 + 5, y, w / 2 - 5, 32, 'Options', { kind: 'ghost', size: 10 })) this.overlay = 'options';
    y += 41;
    if (button(x, y, w, 32, 'Restart fight', { kind: 'ghost', size: 10 })) go(Fight);
    y += 41;
    if (button(x, y, w, 32, 'Quit to timeline', { kind: 'ghost', size: 10, snd: 'uiBack' })) go(Ladder);
  },
  // the coaching line moves on when the player has done what it says
  coach() {
    if (save.tut >= COACH.length) return;
    if (this.coachOk > 0) { if (--this.coachOk === 0) { save.tut++; if (save.tut >= COACH.length) save.tut = 99; writeSave(); this.coachT = 0; } return; }
    this.coachT++;
    if (COACH[save.tut].done(this.p1)) { this.coachOk = 34; sfx('uiOk'); }
  },
  drawCoach() {
    if (save.tut >= COACH.length || this.phase !== 'fight' || this.paused) return;
    const c = COACH[save.tut], f = this.p1, pad = !swipeMode(), gun = !!f.weapon.fire && c.gun;
    let str = gun ? c.gun[pad ? 1 : 0] : pad ? c.pad : c.swipe;
    if (c.wait && f.meter < 100) str = c.wait;
    // sits on the floor between the meter buttons and the right-hand edge, clear of the fighters and of your thumbs
    const left = pad ? 150 : ctl.btns[2].x + ctl.btns[2].r + 14, cx = view.W / 2, maxW = Math.min(360, 2 * (cx - left) - 56);
    const lines = txtLines(str, 13.5, maxW, 700);
    let tw = 0;
    for (const l of lines) tw = Math.max(tw, g.measureText(l).width);
    const n = lines.length, y = 277, hgt = n * 17 + 11, a = clamp(this.coachT / 14, 0, 1) * (this.coachOk ? this.coachOk / 34 : 1);
    g.save(); g.globalAlpha = a;
    g.fillStyle = 'rgba(0,0,0,0.72)'; slabPath(cx - tw / 2 - 34, y - 15, tw + 56, hgt, 3); g.fill();
    g.fillStyle = this.coachOk ? PAPER : RED; slabPath(cx - tw / 2 - 34, y - 15, 5, hgt, 1); g.fill();
    const my = y - 15 + hgt / 2;
    if (this.coachOk) checkIcon(cx - tw / 2 - 16, my, 1, PAPER, 2.4);
    else stickText(String(save.tut + 1), cx - tw / 2 - 16, my + 4.4, 8.5, { align: 0.5, rim: null, col: RED, wt: 0.2 });
    for (let i = 0; i < n; i++) txt(lines[i], cx + 6, y + i * 17, 13.5, { align: 'center', w: 700 });
    g.restore();
  },
  draw() {
    ctl.on = !this.paused && !this.ended;
    this.w.draw();
    this.drawHUD();
    this.drawMarks();
    this.drawCoach();
    drawPad(this.p1);
    this.drawSay();
    if (this.paused) this.drawPause();
  }
};

// ───────── result ─────────
const Result = {
  enter(r) {
    this.r = r; this.t = 0; this.shown = 0;
    this.me = makeDummy(FIGHTER_BY_ID[save.fighter], save.weapon, 2.1);
    this.newWeapon = (r.unlocked.find(u => u.type === 'weapon') || {}).id || null;
    sfx(r.won ? 'win' : 'lose');
  },
  update() {
    this.t++;
    const n = this.r.unlocked.length;
    if (this.shown < n && this.t >= 46 + this.shown * 24) { this.shown++; sfx('unlock'); }
  },
  nextTier() { const n = this.r.n; return n < LAST_TIER ? n + 1 : n === LAST_TIER ? 0 : n + 1; },
  draw() {
    const r = this.r, t = this.t, L = SL() + 16, R = SR() - 16, info = r.info, E = ERAS[info.era];
    menuBg(t);
    g.fillStyle = '#17171a'; slabPath(L + 18, 40, 136, 268, 16); g.fill();
    g.fillStyle = r.won ? RED : '#3a3a40'; slabPath(L + 18, 40, 136, 7, 1); g.fill();
    const me = this.me;
    me.x = L + 80; me.y = 292; me.facing = 1;
    if (r.won) { const p = poseOf(me.weapon, 'win').slice(); p[0] += Math.abs(Math.sin(t * 0.14)) * 2.2; me.setPose(p, t); }
    else { me.x = L + 104; me.setPose(poseOf(me.weapon, 'lying')); }
    drawFighter(me);
    const x = L + 186, w = R - x;
    const u = easeBack(clamp(t / 16, 0, 1));
    stickText(r.won ? 'Victory' : 'Defeat', x - 2 + (1 - u) * 120, 76, 38, { col: r.won ? PAPER : RED, rim: r.won ? RED : PAPER, rimW: 1.4, wt: 0.185, alpha: clamp(t / 6, 0, 1) });
    const where = info.asc ? 'Ascension ' + (r.n - LAST_TIER) : 'Tier ' + r.n + ' of ' + LAST_TIER;
    txt(r.won ? where + ' cleared  ·  ' + E.name : where + '  ·  ' + info.name + ' is still standing.', x, 100, 14, { col: E.hue, w: 700 });
    const s = Math.floor(r.frames / 60);
    txt('Time ' + Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0') + '     Best combo ' + r.combo + (r.perfects ? '     Perfect rounds ' + r.perfects : ''), x, 122, 13, { col: '#c9c9cf', w: 500 });

    let y = 142;
    if (r.won && r.unlocked.length) {
      const cw = Math.min(176, (w - 12 * (r.unlocked.length - 1)) / r.unlocked.length), chh = 96;
      r.unlocked.forEach((un, i) => {
        if (i >= this.shown) return;
        const age = t - (46 + i * 24), pop = easeBack(clamp(age / 12, 0, 1)), cx = x + i * (cw + 12);
        g.save(); g.translate(cx + cw / 2, y + chh / 2); g.scale(pop, pop); g.translate(-cw / 2, -chh / 2);
        g.fillStyle = '#17171a'; slabPath(0, 0, cw, chh, 6); g.fill();
        g.strokeStyle = age < 14 ? PAPER : RED; g.lineWidth = 2.5; g.lineJoin = 'round'; g.stroke();
        txt(un.type === 'weapon' ? 'New weapon' : 'New fighter', 14, 20, 12, { col: RED, w: 700 });
        if (un.type === 'weapon') { drawWeaponIcon(un.id, cw / 2, 50, Math.min(cw - 40, 90), { h: 38 }); stickFit(WEAPONS[un.id].name, cw / 2 - 2, 86, 10.5, cw - 24, { align: 0.5, rim: null, wt: 0.2 }); }
        else { const d = FIGHTER_BY_ID[un.id]; drawPortrait(d, cw / 2 - 24, 26, 48, 46, { bg: '#26262b' }); stickFit(d.name, cw / 2 - 2, 86, 10.5, cw - 24, { align: 0.5, rim: null, wt: 0.2 }); }
        g.restore();
      });
      y += chh + 18;
    }
    let note = null;
    if (r.won && r.n === LAST_TIER && r.first) note = 'That was the last stick. Ascension is now open on the timeline: an endless run of harder fights.';
    else if (r.won && !r.unlocked.length && !info.asc) note = r.first ? 'Nothing new this time. The next tier hits harder.' : 'Already cleared, so nothing new. Still counts as practice.';
    else if (r.won && info.asc) note = r.first ? 'New Ascension best. The next one is harder still.' : 'The next one is harder still.';
    else if (!r.won) note = (r.n > 3 ? 'A different weapon changes the match-up: reach beats speed, a guard beats a flurry, a slide goes under bullets.' : 'Guard the first swing, then hit back while they recover.') + (save.lossCount < 5 ? ' They carry the bruises into the rematch, too: ' + Math.min(save.lossCount, 5) * 5 + '% less health.' : ' They start the rematch 25% down on health.');
    if (note && t > 30) txtWrap(note, x, y + 14, 13.5, Math.min(w, 430), 18, { col: '#c9c9cf', w: 500 });

    const by = SB() - 46;
    if (button(L, by, 120, 36, 'Timeline', { kind: 'ghost', size: 11, snd: 'uiBack', key: ['Escape'] })) go(Ladder);
    if (r.won) {
      const nt = this.nextTier();
      if (this.newWeapon && nt && button(R - 196 - 204, by, 192, 36, 'Use the ' + WEAPONS[this.newWeapon].name, { kind: 'plain', size: 10, disabled: t < 40 })) { save.weapon = this.newWeapon; writeSave(); game.tier = nt; go(Versus); }
      if (button(R - 196, by, 196, 36, nt ? 'Next fight' : 'See the timeline', { kind: 'primary', size: 13, disabled: t < 40, key: ['Enter', 'Space'] })) { if (nt) { game.tier = nt; go(Versus); } else go(Ladder); }
    } else {
      if (button(R - 196 - 180, by, 168, 36, 'Change loadout', { kind: 'plain', size: 10 })) go(Select);
      if (button(R - 196, by, 196, 36, 'Try again', { kind: 'primary', size: 13, disabled: t < 30, key: ['Enter', 'Space'] })) { game.tier = r.n; go(Versus); }
    }
  }
};

// ───────────────────────── boot + main loop ─────────────────────────
function makeIcon() {
  // home-screen icon and favicon, drawn here so the game stays a single file
  try {
    const c = document.createElement('canvas'); c.width = c.height = 180;
    const x = c.getContext('2d');
    x.fillStyle = '#000'; x.fillRect(0, 0, 180, 180);
    x.fillStyle = RED; x.beginPath(); x.moveTo(70, 0); x.lineTo(180, 0); x.lineTo(180, 60); x.lineTo(110, 180); x.lineTo(0, 180); x.lineTo(0, 120); x.closePath(); x.fill();
    x.lineCap = 'round'; x.lineJoin = 'round';
    const body = () => { x.beginPath(); x.moveTo(84, 72); x.lineTo(76, 112); x.lineTo(60, 132); x.lineTo(66, 156); x.moveTo(76, 112); x.lineTo(112, 108); x.lineTo(146, 92);
      x.moveTo(83, 78); x.lineTo(104, 86); x.lineTo(112, 66); x.moveTo(83, 78); x.lineTo(62, 92); x.lineTo(70, 108); x.stroke(); };
    x.strokeStyle = '#000'; x.lineWidth = 22; body(); x.fillStyle = '#000'; x.beginPath(); x.arc(88, 48, 24, 0, TAU); x.fill();
    x.strokeStyle = '#fff'; x.lineWidth = 12; body(); x.fillStyle = '#fff'; x.beginPath(); x.arc(88, 48, 18, 0, TAU); x.fill();
    const url = c.toDataURL('image/png');
    const a = document.getElementById('touchicon'), b = document.getElementById('favicon');
    if (a) a.href = url; if (b) b.href = url;
  } catch (e) { /* cosmetic only */ }
}

function drawRotatePrompt(t) {
  g.setTransform(view.pS, 0, 0, view.pS, 0, 0);
  const W = 390, H = view.pH, cy = H * 0.34;
  g.fillStyle = '#000000'; g.fillRect(0, 0, W, H);
  const cyc = (t % 170) / 170, a = -easeIO(clamp((cyc - 0.25) / 0.3, 0, 1)) * PI / 2;
  g.save(); g.translate(W / 2, cy); g.rotate(a);
  g.strokeStyle = PAPER; g.lineWidth = 5; g.lineJoin = 'round'; rrectPath(-36, -66, 72, 132, 13); g.stroke();
  g.fillStyle = RED; g.fillRect(-12, -58, 24, 5);
  g.restore();
  stickText('Turn your phone', W / 2, cy + 128, 20, { align: 0.5, rim: null });
  txt('Stick Ages plays in landscape.', W / 2, cy + 156, 16, { align: 'center', col: '#c9c9cf', w: 500 });
  const bw = 270, bx = (W - bw) / 2, by = cy + 196;
  if (button(bx, by, bw, 46, 'Play sideways', { kind: 'ghost', size: 13 })) { save.sideways = true; writeSave(); layout(); }
  g.textAlign = 'center';
  txtWrap('Rotation lock on? This draws the game turned on its side, so you can leave the lock alone.', W / 2, by + 74, 14, 300, 19, { align: 'center', col: '#8d8d93', w: 500 });
}

function stepAll() {
  tick++;
  if (view.portrait && !view.rot) return;
  if (trans) {
    trans.t++;
    if (trans.t === 8) { if (scene && scene.leave) scene.leave(); scene = trans.to; scene.enter(trans.arg); }
    if (trans.t >= 16) trans = null;
  }
  if (scene && scene.update) scene.update();
}
let fpsAvg = 16.7, slowFrames = 0;
function render() {
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.globalAlpha = 1;
  g.fillStyle = '#000000'; g.fillRect(0, 0, canvas.width, canvas.height);
  if (view.portrait && !view.rot) { drawRotatePrompt(tick); return; }
  baseXform();
  g.save();
  g.beginPath(); g.rect(0, 0, view.W, VH); g.clip();
  if (trans) ui.clicks.length = 0;
  scene.draw();
  if (trans) {
    const u = trans.t / 8;
    let x0, x1;
    if (u <= 1) { x0 = -80; x1 = lerp(-80, view.W + 160, easeIn(u)); } else { x0 = lerp(-160, view.W + 80, easeOut(u - 1)); x1 = view.W + 160; }
    g.fillStyle = '#000000'; slabPath(x0, 0, x1 - x0, VH, 62); g.fill();
    g.fillStyle = RED; slabPath(u <= 1 ? x1 - 5 : x0 - 5, 0, 10, VH, 62); g.fill();
  }
  if (DEV) txt((1000 / fpsAvg).toFixed(0) + ' fps  q' + quality.toFixed(2) + '  ' + Math.round(view.W) + 'x' + VH, SR() - 10, SB() - 6, 10, { align: 'right', col: '#00ff66', sh: true });
  g.restore();
}

let lastT = 0, acc = 0;
function frame(now) {
  requestAnimationFrame(frame);
  if (window.innerWidth !== lastIW || window.innerHeight !== lastIH || (window.devicePixelRatio || 1) !== lastDPR) layout();
  let dt = (now - lastT) / 1000;
  lastT = now;
  if (!(dt > 0) || dt > 0.25) dt = DT;
  fpsAvg += (dt * 1000 - fpsAvg) * 0.05;
  // if the phone cannot hold the frame rate at full resolution, render a little softer
  if (scene === Fight && dt > 0.024) { if (++slowFrames > 90 && quality > 0.6) { quality = Math.max(0.6, quality - 0.15); slowFrames = 0; layout(); } }
  else if (slowFrames > 0) slowFrames--;
  acc += dt;
  let n = 0;
  pollGamepad();
  while (acc >= DT - 0.0005 && n < 4) { stepAll(); acc -= DT; n++; }
  if (n === 4) acc = 0;
  try { render(); }
  catch (err) {                                             // never leave a dead screen: log it, reset the canvas state, carry on
    if (window.console) console.error(err);
    canvas.width = canvas.width;
  } finally { ui.clicks.length = 0; keyHits.length = 0; ui.wheel = 0; }
}

document.addEventListener('visibilitychange', () => {
  if (document.hidden) { if (scene === Fight && !Fight.paused && !Fight.ended && Fight.phase !== 'after') Fight.paused = true; releaseAll(); }
  lastT = performance.now(); acc = 0;
});
window.addEventListener('resize', layout);
window.addEventListener('orientationchange', () => { layout(); setTimeout(layout, 120); setTimeout(layout, 400); });
if (window.visualViewport) window.visualViewport.addEventListener('resize', layout);

if (/[?&]test\b/.test(location.search)) {
  window.__sa = { save, view, ctl, ui, game, go, layout, writeSave, AudioSys, keys, tierInfo, difficulty, World, AI, Fighter, FIGHTERS, WEAPONS, WEAPON_ORDER, TIERS, FIGHTER_BY_ID, blankInput,
    scenes: { Title, Select, Armory, Ladder, Versus, Fight, Result }, get scene() { return scene; }, get trans() { return trans; }, get tick() { return tick; } };
}

makeIcon();
layout();
scene = Title; Title.enter();
requestAnimationFrame(t => { lastT = t; requestAnimationFrame(frame); });

})();
</script>
</body>
